<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>StartGG Overlay Control</title>
    <link rel="stylesheet" href="control.css">
  </head>
  <body>
    <h1>Overlay Control</h1>
    <div style="margin-top:8px">
      <label>Tournament slug or URL: <input id="tournament" placeholder="tournament slug or full URL (e.g. https://www.start.gg/tournament/evo-2024/details)" /></label>
      <button id="btnTournament">Load Tournament</button>
    </div>

    <div id="status" style="margin-bottom:8px;color:gray">Status: disconnected</div>
    <div style="margin-top:12px">
      <label>Event: <select id="eventsSelect"><option value="">-- choose event --</option></select></label>
    </div>
    <div style="margin-top:8px">
      <label>Participants (multi-select): <select id="participantsSelect" multiple size="10" style="min-width:320px"></select></label>
    </div>
    <div style="margin-top:8px">
      <button id="applySelection">Show Selected</button>
      <button id="clearSelection">Clear</button>
    </div>
    <div id="currentSelection" style="margin-top:8px;color:blue">Current: none</div>

    <script src="control.js" defer></script>
  </body>
 </html>
